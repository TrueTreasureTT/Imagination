<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Imagination web application">
  <title>Imagination</title>

  <link rel="stylesheet" href="/style.css">

  <!-- Runtime scripts remain enabled; only the visible Scramjet label was removed. -->
  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Imagination</h1>
      </div>

      <nav class="browser-controls" aria-label="Browser controls">
        <button id="back" type="button" disabled title="Back">←</button>
        <button id="forward" type="button" disabled title="Forward">→</button>
        <button id="reload" type="button" title="Reload">↻</button>
        <button id="home" type="button" title="Home">⌂</button>
      </nav>

      <form id="proxy-form" autocomplete="off">
        <div class="address-wrap">
          <input
            id="address"
            name="address"
            autofocus
            spellcheck="false"
            placeholder="Search the web or enter a URL"
            aria-label="Address"
          >
          <div id="suggestions" class="suggestions" hidden></div>
        </div>

        <button class="go-button" type="submit">Go</button>
      </form>

      <div class="utility-controls">
        <button id="history" type="button">History</button>
      </div>
    </header>

    <section class="status-row">
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <aside id="history-panel" hidden>
      <div class="history-header">
        <strong>History</strong>
        <button id="clear-history" type="button">Clear</button>
      </div>
    </aside>

    <section id="browser" class="browser" aria-label="Browser content">
      <div class="welcome">
        <div class="quick-actions" aria-label="Popular websites">
          <button
            type="button"
            class="site-action discord-action"
            data-url="https://discord.com"
            title="Open Discord"
            aria-label="Open Discord"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M20.32 4.37A19.8 19.8 0 0 0 15.48 3l-.6 1.22a18.2 18.2 0 0 0-5.76 0L8.52 3a19.74 19.74 0 0 0-4.84 1.38C.62 8.92-.21 13.35.21 17.72A19.9 19.9 0 0 0 6.14 20.7l1.44-1.98a12.3 12.3 0 0 1-2.27-1.08l.54-.42c4.37 2.05 9.12 2.05 13.44 0l.54.42a14.5 14.5 0 0 1-2.28 1.08l1.44 1.98a19.8 19.8 0 0 0 5.93-2.98c.5-5.07-.86-9.46-3.6-13.35ZM8.02 15.05c-1.16 0-2.1-1.06-2.1-2.37 0-1.3.92-2.37 2.1-2.37 1.18 0 2.12 1.07 2.1 2.37 0 1.31-.92 2.37-2.1 2.37Zm7.96 0c-1.16 0-2.1-1.06-2.1-2.37 0-1.3.92-2.37 2.1-2.37 1.18 0 2.12 1.07 2.1 2.37 0 1.31-.92 2.37-2.1 2.37Z"/>
            </svg>
            <span>Discord</span>
          </button>

          <button
            type="button"
            class="site-action youtube-action"
            data-url="https://www.youtube.com"
            title="Open YouTube"
            aria-label="Open YouTube"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M23.5 6.19a3 3 0 0 0-2.11-2.12C19.52 3.5 12 3.5 12 3.5s-7.52 0-9.39.57A3 3 0 0 0 .5 6.19C0 8.06 0 12 0 12s0 3.94.5 5.81a3 3 0 0 0 2.11 2.12c1.87.57 9.39.57 9.39.57s7.52 0 9.39-.57a3 3 0 0 0 2.11-2.12C24 15.94 24 12 24 12s0-3.94-.5-5.81ZM9.6 15.74V8.26L16.14 12 9.6 15.74Z"/>
            </svg>
            <span>YouTube</span>
          </button>

          <button
            type="button"
            class="site-action spotify-action"
            data-url="https://open.spotify.com"
            title="Open Spotify"
            aria-label="Open Spotify"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.5 17.3a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.1-10.55-1.15a.75.75 0 1 1-.33-1.46c4.57-1.04 8.48-.6 11.61 1.31.35.21.46.67.3 1.05Zm1.47-3.27a.94.94 0 0 1-1.3.31c-3.23-1.98-8.15-2.55-11.97-1.39a.94.94 0 0 1-.55-1.8c4.37-1.33 9.8-.68 13.5 1.59.44.27.58.85.32 1.29Zm.13-3.4C15.23 8.33 8.85 8.12 5.14 9.25a1.13 1.13 0 0 1-.66-2.16c4.26-1.3 11.34-1.05 15.82 1.61a1.13 1.13 0 1 1-1.2 1.93Z"/>
            </svg>
            <span>Spotify</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
